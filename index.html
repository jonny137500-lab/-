<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e7b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>旅行青蛙 · Offline</title>
</head>
<body>
<div id="app">
<header class="topbar"><div><b>旅行青蛙</b><small>OFFLINE EDITION</small></div><button id="resetBtn" class="ghost">重置存档</button></header>
<main>
<section class="scene">
<div class="sky"></div><div class="hill h1"></div><div class="hill h2"></div>
<div class="room">
<div class="window"><div class="view">☀️</div></div>
<div class="table"><div class="mat"></div><div id="frog" class="frog">🐸</div><div class="pot">🍵</div></div>
</div>
<div id="status" class="bubble">青蛙正在家里休息。</div>
</section>
<section class="panel">
<div class="stats"><span>🍀 三叶草 <b id="clover">0</b></span><span>🎒 背包 <b id="bagCount">0</b></span><span>📮 明信片 <b id="postcards">0</b></span></div>
<nav><button class="tab active" data-tab="home">家</button><button class="tab" data-tab="shop">商店</button><button class="tab" data-tab="bag">背包</button><button class="tab" data-tab="album">相册</button></nav>
<div id="content"></div>
</section>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
