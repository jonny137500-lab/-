<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ead9a7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>旅行青蛙 · Offline Edition</title>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/title.png" alt="旅行青蛙"><small>OFFLINE EDITION</small></div>
  <div class="top-actions">
    <span class="clover-pill"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/clover_160.png" alt=""> <b id="clover">0</b></span>
    <button id="musicBtn" class="ghost" type="button">🔇 音乐</button><button id="resetBtn" class="ghost">重置</button>
  </div>
</header>

<main>
<section class="scene">
  <img class="official-banner" src="https://www.hit-point.co.jp/games/tabikaeru/img/banner_tabikaeru.png" alt="旅かえる 官方宣传图">
  <div class="garden-sky"></div><img class="garden-light" src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/haikei_niwa_akari.png" alt="">
  <div class="mist"></div>
  <div class="tree trunk-left"></div>
  <div class="tree trunk-right"></div>
  <div class="leaf-cluster leaf-a"></div><div class="leaf-cluster leaf-b"></div>
  <div class="wood-house">
    <div class="roof"></div>
    <div class="window"><span>☀</span></div>
    <div class="shelf"><span>📚</span><span>🍵</span><span>🌿</span></div>
    <div class="bed"><div class="pillow"></div></div>
    <div id="frog" class="frog" aria-label="青蛙"></div>
    <div class="door"></div>
    <div class="floor"></div>
  </div>
  <div id="mailbox" class="mailbox" title="邮箱"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/other/MainOut_mail_tuuti.png" alt="邮箱"><span id="mailBadge" class="mail-badge">0</span></div>
  <img class="scene-role snail" src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/role/2/role2.png" alt="">
  <img class="scene-role visitor" src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/role/4/role4.png" alt="">
  <button id="menuArt" class="menu-art" title="菜单"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_menu_92_96.png" alt="菜单"></button>
  <div id="status" class="bubble">青蛙正在家里休息。</div>
  <div id="sourceDrawer" class="source-drawer" aria-hidden="true"><div class="drawer-head"><strong>旅行青蛙素材库</strong><button id="closeDrawer" class="ghost" type="button">关闭</button></div><div class="drawer-note">已接入授权的 TravelFrog source 素材：背景、角色、伙伴、UI、抽奖、加载、名称/图鉴和提示素材。</div><div class="source-gallery"><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/start.png" alt=""><small>开始</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/loading.png" alt=""><small>加载</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/loading_on.png" alt=""><small>加载ON</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/loading_off.png" alt=""><small>加载OFF</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/loading_dorai.png" alt=""><small>加载装饰</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/back.png" alt=""><small>背景</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/back_mainIn.png" alt=""><small>室内</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/back_mainOut_2_L.png" alt=""><small>庭院左</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/back_mainOut_2_R.png" alt=""><small>庭院右</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/sys_clover_window.png" alt=""><small>三叶草窗口</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/clover_154.png" alt=""><small>三叶草154</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/clover_166.png" alt=""><small>三叶草166</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_help_84_88.png" alt=""><small>帮助</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_out_84_88.png" alt=""><small>退出</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_urabeya_84_88.png" alt=""><small>里屋</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/name/frame_01.png" alt=""><small>名称框</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/name/frame_name.png" alt=""><small>名字框</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/name/icon_name.png" alt=""><small>姓名</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/name/icon_syougou.png" alt=""><small>称号</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/name/ok.png" alt=""><small>确认</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/name/zukan_title.png" alt=""><small>图鉴</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/other/hi_syokudai_01.png" alt=""><small>提示01</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/other/hi_syokudai_02.png" alt=""><small>提示02</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/other/hi_syokudai_03.png" alt=""><small>提示03</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/lottery_ball_02.png" alt=""><small>抽奖02</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/lottery_ball_03.png" alt=""><small>抽奖03</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/lottery_ball_04.png" alt=""><small>抽奖04</small></div><div><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/lottery_ball_05.png" alt=""><small>抽奖05</small></div></div></div>
</section>
<audio id="bgm" loop preload="auto" src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/audio/bgm.mp3"></audio>
<section class="panel">
  <div class="stats">
    <span>🎒 背包 <b id="bagCount">0</b></span>
    <span>🎟️ 抽奖券 <b id="tickets">0</b></span>
    <span>📮 明信片 <b id="postcards">0</b></span>
  </div>
  <nav>
    <button class="tab active" data-tab="home"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_house_84_88.png" alt="">家</button>
    <button class="tab" data-tab="prepare"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_item_84_88.png" alt="">准备</button>
    <button class="tab" data-tab="shop"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_shop_84_88.png" alt="">商店</button>
    <button class="tab" data-tab="album"><img src="https://raw.githubusercontent.com/jsmask/TravelFrog/master/assets/Texture/ui/icon_camera_84_88.png" alt="">相册</button>
  </nav>
  <div id="content"></div>
</section>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
